name: Build APK (Ofuscada)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OPENSSL_VERSION: "3.0.15"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy Rust project (bypass submodule)
        run: |
          mkdir -p app/src/main/rust/slipstream-rust/src
          echo '[package]' > app/src/main/rust/slipstream-rust/Cargo.toml
          echo 'name = "slipstream-rust"' >> app/src/main/rust/slipstream-rust/Cargo.toml
          echo 'version = "0.1.0"' >> app/src/main/rust/slipstream-rust/Cargo.toml
          echo 'edition = "2021"' >> app/src/main/rust/slipstream-rust/Cargo.toml
          touch app/src/main/rust/slipstream-rust/src/lib.rs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup OpenSSL for Android
        run: |
          chmod +x app/scripts/build-openssl-android.sh
          OUTPUT_DIR=$HOME/android-openssl/android-ssl \
          OPENSSL_VERSION=${{ env.OPENSSL_VERSION }} \
          NDK_VERSION=27.0.12077973 \
          ./app/scripts/build-openssl-android.sh

      - name: Build Lite Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleLiteRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlipNet-Obfuscated
          path: app/build/outputs/apk/lite/release/*.apk
