name: Patch APK (Prometheo)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download latest Apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          mv apktool_2.10.0.jar apktool.jar

      - name: Decompile
        run: java -jar apktool.jar d SlipNet-v2.5.3-lite-release-universal.apk -o SlipNet-mod

      - name: Obfuscate
        run: |
          find SlipNet-mod -type f -name "*.smali" -exec sed -i 's/Response Record Type/Connection Mode/g' {} +
          find SlipNet-mod -type f -name "*.xml" -exec sed -i 's/Response Record Type/Connection Mode/g' {} +
          sed -i 's/SlipNet Lite/Prometheo/g' SlipNet-mod/res/values/strings.xml
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|https\?://github\.com/[^ "]*|https://example.com|g' {} +

      - name: Rebuild
        run: java -jar apktool.jar b SlipNet-mod -o SlipNet-Prometheo-unsigned.apk

      - name: Sign APK
        run: |
          # Generar un keystore de depuración
          keytool -genkeypair -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Prometheo Debug, OU=Dev, O=Prometheo, L=City, ST=State, C=US"
          # Firmar la APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass android -keypass android \
            SlipNet-Prometheo-unsigned.apk debug
          # Renombrar para que sea más claro
          mv SlipNet-Prometheo-unsigned.apk SlipNet-Prometheo-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Prometheo-APK
          path: SlipNet-Prometheo-signed.apk
