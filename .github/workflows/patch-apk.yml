name: Patch APK (Prometheo)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download latest Apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          mv apktool_2.10.0.jar apktool.jar

      - name: Decompile
        run: java -jar apktool.jar d SlipNet-v2.5.3-lite-release-universal.apk -o SlipNet-mod

      - name: Obfuscate
        run: |
          # Cambiar "Response Record Type" por "Connection Mode"
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/Response Record Type/Connection Mode/g' {} +
          
          # Reemplazar nombres de tipos de registro por alias numéricos NO secuenciales
          # Orden original en la UI: txt, cname, a, aaaa, mx, ns, srv, null, caa
          # Nuevo mapeo (posición -> alias):
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"txt"/"Método 7"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"cname"/"Método 2"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"a"/"Método 9"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"aaaa"/"Método 1"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"mx"/"Método 5"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"ns"/"Método 8"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"srv"/"Método 3"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"null"/"Método 4"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"caa"/"Método 6"/g' {} +
          
          # Cambiar nombre de la app y eliminar URLs de GitHub
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/SlipNet/Prometheo/g' {} +
          sed -i 's/SlipNet Lite/Prometheo/g' SlipNet-mod/res/values/strings.xml
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|https\?://github\.com/[^ "]*|https://example.com|g' {} +

      - name: Rebuild
        run: java -jar apktool.jar b SlipNet-mod -o SlipNet-Prometheo-unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Prometheo Debug, OU=Dev, O=Prometheo, L=City, ST=State, C=US"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass android -keypass android \
            SlipNet-Prometheo-unsigned.apk debug
          mv SlipNet-Prometheo-unsigned.apk SlipNet-Prometheo-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Prometheo-APK
          path: SlipNet-Prometheo-signed.apk
