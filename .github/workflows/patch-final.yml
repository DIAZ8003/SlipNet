name: Build Final Prometheo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          
      - name: Decompile APK
        run: java -jar apktool.jar d SlipNet-v2.5.3-lite-release-universal.apk -o SlipNet-mod
        
      - name: Apply Mods
        run: |
          # ... (todos los cambios de ofuscación que ya teníamos) ...
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/Response Record Type/Connection Mode/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"txt"/"Método 7"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"cname"/"Método 2"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"a"/"Método 9"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"aaaa"/"Método 1"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"mx"/"Método 5"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"ns"/"Método 8"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"srv"/"Método 3"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"null"/"Método 4"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/"caa"/"Método 6"/g' {} +
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's/SlipNet/Prometheo/g' {} +
          sed -i 's/SlipNet Lite/Prometheo/g' SlipNet-mod/res/values/strings.xml
          find SlipNet-mod -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i 's|https\?://github\.com/[^ "]*|https://example.com|g' {} +
          
          # --- CORRECCIONES EXACTAS PARA QUE COMPILE ---
          # Eliminar TODOS los atributos de los widgets que no sean estándar
          sed -i 's/android:widgetCategory="home_screen"//g' SlipNet-mod/res/xml/widget_vpn_compact_info.xml
          sed -i 's/android:previewLayout="@layout\/widget_vpn_compact"//g' SlipNet-mod/res/xml/widget_vpn_compact_info.xml
          sed -i 's/android:widgetCategory="home_screen"//g' SlipNet-mod/res/xml/widget_vpn_toggle_info.xml
          sed -i 's/android:previewLayout="@layout\/widget_vpn_toggle"//g' SlipNet-mod/res/xml/widget_vpn_toggle_info.xml
          # Eliminar referencias dummy
          find SlipNet-mod -type f -name "public.xml" -exec sed -i '/APKTOOL_DUMMY/d' {} +
          # Revertir nombre de tema
          find SlipNet-mod -type f -name "styles.xml" -exec sed -i 's/Theme.Prometheo/Theme.SlipNet/g' {} +
          find SlipNet-mod -type f -name "public.xml" -exec sed -i 's/Theme.Prometheo/Theme.SlipNet/g' {} +

      - name: Rebuild APK
        run: java -jar apktool.jar b SlipNet-mod -o Prometheo-unsigned.apk
        
      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Prometheo Debug, OU=Dev, O=Prometheo, L=City, ST=State, C=US"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass android -keypass android \
            Prometheo-unsigned.apk debug
          mv Prometheo-unsigned.apk Prometheo.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prometheo-Final-APK
          path: Prometheo.apk
